};
const SFXBANK = {
  click: [7,3,180,1,180,2,8,,9,1,160,2,,700,500,900,200,3,900,200,,,,1,,1,5,200],
  lore:  [0,0,200,1,300,2,8,,4,1,200,2,,3000,1500,20000,200,4,1000,200,,,,1,,1,4,200],
  bonk:  [8,1,90,0,150,1,8,,12,0,90,2,,7000,300,30000,255,1,300,255,,,,1,,1,2,255],

};

/* ── AUDIO: music and sfx on separate gains, buffers pre-built ── */
let AC = null, synth = null, musicGain = null, sfxGain = null, musicAnalyser = null;
let musicOn = false, audioReady = false, musicSrc = null, musicName = null;
let sfxCache = {};
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    synth = pl_synth_init(AC);
    musicGain = AC.createGain(); musicGain.gain.value = 0.5;
    musicAnalyser = AC.createAnalyser(); musicAnalyser.fftSize = 512;
    musicGain.connect(musicAnalyser); musicAnalyser.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
// Tracker exports sometimes truncate an instrument's trailing zeros.
// Missing params poison the synth math with NaN and render a 0-sample
// song (which used to murder the music on dialogue entry). Pad them.
function padSong(song) {
  for (const pat of song[1]) {
    while (pat[0].length < 26) pat[0].push(0);
  }
  return song;
}
// Safety net: an out-of-range synth param renders NaN, and playing a
// NaN buffer mutes the whole AudioContext (music included). Scrub every
// rendered buffer once at build time so this can never happen again.
function clean(buf) {
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) if (!isFinite(d[i])) d[i] = 0;
  }
  return buf;
}
function trackBuffer(t) {
  if (t.buffer) return t.buffer;
  if (!t.song) return null;
  try {
    if (!t._padded) { padSong(t.song); t._padded = true; }
    const b = clean(synth.song(t.song));
    if (b.getChannelData(0).length > 0) { t.buffer = b; return b; }
  } catch (e) {}
  return null;
}
// Per-letter speech samples for Päivi & Pludski (sfx/speech/<voice>/<a-z>.ogg).
// Fetch starts at page boot (no AudioContext needed); decoding happens once
// AC exists. typeBlip falls back to oscillator until a sample is decoded.
let speechCache = {}; // "päivi/a" -> AudioBuffer
let speechRaw = {};   // "päivi/a" -> ArrayBuffer (pre-decode)
let speechFailed = {}; // urls that 404'd, so we stop retrying them
function speechURL(voice, letter) {
  return encodeURI("sfx/speech/" + voice + "/" + letter + ".ogg");
}
function fetchSpeechRaw() {
  try {
    const voices = ["päivi", "pludski"];
    const letters = "abcdefghijklmnopqrstuvwxyz";
    for (const v of voices) {
      for (const ch of letters) {
        const key = v + "/" + ch;
        if (speechRaw[key] || speechFailed[key]) continue;
        fetch(speechURL(v, ch)).then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.arrayBuffer();
        }).then(ab => {
          speechRaw[key] = ab;
          decodeSpeechKey(key);
        }).catch(err => {
          speechFailed[key] = true;
          try { console.warn("[pludski] speech fetch failed:", speechURL(v, ch), err); } catch (_) {}
        });
      }
    }
  } catch (e) {}
}
function decodeSpeechKey(key) {
  try {
    if (speechCache[key] || !speechRaw[key] || !AC) return;
    // slice: decodeAudioData detaches the buffer, keep the original for retry
    AC.decodeAudioData(speechRaw[key].slice(0)).then(buf => {
      speechCache[key] = buf;
    }).catch(err => {
      try { console.warn("[pludski] speech decode failed:", key, err); } catch (_) {}
    });
  } catch (e) {}
}
function decodeSpeech() {
  try {
    for (const key of Object.keys(speechRaw)) decodeSpeechKey(key);
  } catch (e) {}
}
// Start fetching samples immediately at page boot so they're warm by dialogue.
fetchSpeechRaw();
// Pre-build every buffer up front so attacks never hitch the music.
function prebuild() {
  sfxCache = {};
  for (const k of Object.keys(SFXBANK)) {
    sfxCache[k + "147"] = clean(synth.sound(SFXBANK[k], 147));
    sfxCache[k + "120"] = clean(synth.sound(SFXBANK[k], 120));
    sfxCache[k + "150"] = clean(synth.sound(SFXBANK[k], 150));
    sfxCache[k + "165"] = clean(synth.sound(SFXBANK[k], 165));
  }
  for (const k of Object.keys(TRACKS)) trackBuffer(TRACKS[k]);
  audioReady = true;
  decodeSpeech();
}
function sfx(kind, note, vol) {
  try {
    if (!audioReady) return;
    if (AC.state === "suspended") AC.resume();
    const key = kind + (note || 147);
    const buf = sfxCache[key] || sfxCache[kind + "147"];
    if (!buf) return;
    const s = AC.createBufferSource();
    s.buffer = buf;
    const g = AC.createGain();
    g.gain.value = (vol === undefined ? 0.9 : vol);
    s.connect(g); g.connect(sfxGain);
    s.start();
  } catch (e) {}
}
function loopEndFor(buf) {
  // Trim the render tail (up to ~1s of near-silence on some tracks) so
  // loop=true actually loops instead of pausing on every pass.
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let last = L.length - 1;
  while (last > 0 && Math.abs(L[last]) < 0.01 && Math.abs(R[last]) < 0.01) last--;
  return Math.min(buf.duration, last / AC.sampleRate + 0.05);
}
function playMusic(name, force) {
  musicName = name;
  if (!musicOn || !audioReady) return;
  if (!force && musicSrc && musicSrc._track === name) return; // same song: keep playing, don't restart
  const t = TRACKS[name];
  const buf = t && trackBuffer(t);
  if (!buf) return; // broken track: leave whatever is playing alone
  stopMusic();
  try {
    if (AC.state === "suspended") AC.resume();
    // Simple native loop: one source per track, loop handled by the
    // audio thread. No JS timer chain, no crossfade overlap, so nothing
    // on the main thread (SFX, button re-renders) can gap it.
    const src = AC.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = 0;
    src.loopEnd = loopEndFor(buf);
    src.connect(musicGain);
    src._track = name;
    src._dead = false;
    // Self-healing without sniffing: a loop=true source only ends when
    // killed/stopped, so restart only on unexpected death — never on a
    // quiet passage (the old RMS watchdog false-triggered on sparse
    // tracks like the dialogue theme and restarted them at random).
    src.onended = () => {
      try {
        if (!src._dead && musicOn && musicName === name) playMusic(name, true);
      } catch (e) {}
    };
    src.start();
    musicSrc = src;
    $("nowplay").textContent = "now playing: " + t.label;
  } catch (e) {}
}
function stopMusic() {
  const s = musicSrc; musicSrc = null;
  if (s) { s._dead = true; s.onended = null; try { s.stop(); } catch (e) {} }
}
// Tension silence: stop the music and clear the desired track so nothing
// restarts it. The next playMusic() call resumes.
function silenceMusic() {
  musicName = null;
  stopMusic();
  try { $("nowplay").textContent = ""; } catch (e) {}
}
$("musbtn").onclick = () => {
  musicOn = !musicOn;
  $("musbtn").textContent = musicOn ? "🔊 MUSIC: ON" : "🔇 MUSIC: OFF";
  if (musicOn) {
    audio();
    if (!audioReady) prebuild(); // one-time hitch, on an explicit click
    playMusic(musicName || "town");
  } else { stopMusic(); $("nowplay").textContent = ""; }
};
// Autoplay: called from the name-enter click (a real user gesture).
function enableMusic() {
  if (musicOn) return;
  musicOn = true;
  $("musbtn").textContent = "🔊 MUSIC: ON";
  audio();
  if (!audioReady) prebuild();
  playMusic(musicName || "town");
}

/* ── RPG DIALOGUE: fast typewriter, skip button, options appear only when done.
   Layout-stability: before typing we synchronously paint the FULL text,
   measure its final height, and lock #text min-height to it — so buttons/
   skip sit at their final positions from frame one and nothing rescales
   or jumps while letters appear. (No paint happens mid-measure because
   we clear it back in the same synchronous block.) */
let typeTimer = null, typeFull = "", typeIdx = 0, typePending = null, typing = false;
const TYPE_CHAR_MS = 26, TYPE_NEWLINE_MS = 280;
// One fixed voice per story character. Fully deterministic, no randomness.
// sample: per-letter ogg set in sfx/speech/<sample>/ (päivi, pludski);
// others use the fixed oscillator pip [f, w].
const VOICES = {
  "SLOP": { f: 240, w: "square" },

};
let typeVoice = { f: 440, w: "square", sample: null };
function voiceFor(name) {
  const n = (name || "").toUpperCase();
  for (const k of Object.keys(VOICES)) { if (n.indexOf(k) !== -1) return VOICES[k]; }
  return { f: 440, w: "square", sample: null };
}
function hideSkip() { try { $("skipbtn").style.display = "none"; } catch (e) {} }
function showSkip() { try { $("skipbtn").style.display = ""; } catch (e) {} }
function stopTyping() {
  if (typeTimer) { clearTimeout(typeTimer); clearInterval(typeTimer); typeTimer = null; }
  typing = false; typePending = null;
  try { $("text").classList.remove("typing"); } catch (e) {}
  hideSkip();
}
function typeBlip(ch) {
  // Päivi & Pludski: play their per-letter speech sample
  // (sfx/speech/<voice>/<a-z>.ogg). Fixed rate, fixed volume, no randomness.
  // Everyone else: one fixed oscillator pip for the speaker. Same chain
  // (sfxGain only) either way — music untouched.
  try {
    if (!audioReady || !AC || !sfxGain) return;
    if (AC.state !== "running") return;
    if (typeVoice.sample && ch) {
      let L = ch.toLowerCase();
      if (L >= "a" && L <= "z") {
        if (L === "w") L = "v"; // folders ship a–z minus w; w reuses v
        const key = typeVoice.sample + "/" + L;
        decodeSpeechKey(key); // in case raw arrived but isn't decoded yet
        const buf = speechCache[key];
        if (buf) {
          const s = AC.createBufferSource();
          s.buffer = buf;
          s.playbackRate.value = 1.0;
          const g = AC.createGain();
          g.gain.value = 0.8;
          s.connect(g); g.connect(sfxGain);
          s.start();
          return;
        }
      }
    }
    const t = AC.currentTime;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = typeVoice.w;
    o.frequency.setValueAtTime(typeVoice.f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + 0.055);
  } catch (e) {}
}
function lockToFinalHeight(finalText) {
  const t = $("text");
  // Synchronous measure: full text -> height -> clear. No paint in between.
  t.classList.remove("typing");
  t.textContent = finalText;
  const h = t.offsetHeight;
  t.textContent = "";
  t.style.minHeight = Math.max(120, h) + "px";
}
function finishTyping() {
  if (!typing) return;
  if (typeTimer) { clearTimeout(typeTimer); clearInterval(typeTimer); typeTimer = null; }
  typing = false;
  const t = $("text");
  t.textContent = typeFull;
  t.classList.remove("typing");
  hideSkip();
  const f = typePending; typePending = null;
  if (f) f();
}
try {
  $("skipbtn").onclick = e => { try { e.stopPropagation(); } catch (_) {} finishTyping(); };
} catch (e) {}
// Keyboard fast-forward: Enter/Space completes text (never hijacks name input).
try {
  document.addEventListener("keydown", e => {
    if (!typing) return;
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
      e.preventDefault();
      finishTyping();
    }
  });
} catch (e) {}
function typeText(finalText, onDone, voice) {
  stopTyping();
  lockToFinalHeight(finalText);
  typeVoice = voice || typeVoice;
  typeFull = finalText; typeIdx = 0; typePending = onDone || null;
  const t = $("text");
  t.textContent = "";
  t.classList.add("typing");
  // Empty text: finish immediately so options never get stuck hidden.
  if (!finalText) { finishTyping(); return; }
  showSkip();
  typing = true;
  t.onclick = () => finishTyping();
  // Char-by-char via chained timeouts so newlines can pause longer.
  const step = () => {
    if (!typing) return;
    typeIdx += 1;
    if (typeIdx >= typeFull.length) { finishTyping(); return; }
    t.textContent = typeFull.slice(0, typeIdx);
    const c = typeFull[typeIdx - 1];
    if (c !== " " && c !== "\n" && c !== "\r" && c !== "\t") typeBlip(c);
    typeTimer = setTimeout(step, c === "\n" ? TYPE_NEWLINE_MS : TYPE_CHAR_MS);
  };
  typeTimer = setTimeout(step, TYPE_CHAR_MS);
}
function renderButtons(list) {
  const b = $("btns"); b.innerHTML = "";
  try { $("text").onclick = null; } catch (e) {}
  list.forEach(([label, fn, cls, dis]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (cls) btn.className = cls;
    if (dis) btn.disabled = true;
    btn.onclick = () => { sfx("click", 0, 0.35); fn(); };
    b.appendChild(btn);
  });
}
function setScene(face, name, text, buttons, glow) {
  stopTyping();
  $("face").textContent = face;
  $("name").textContent = name;
  $("name").classList.toggle("glow", !!glow);
  $("bars").style.display = "none";
  $("btns").innerHTML = ""; // keep hidden until text is done
  refreshBar();
  typeText(text, () => renderButtons(buttons), voiceFor(name));
}

/* ── 4. BOSS FIGHT (winnable, honest numbers) ──
   You: ~120 HP, bonk ~16.5/turn, 2–3 bombs ~32, prays to spare.
   Pludski: 140 HP, ~8.5/turn (enraged ~12). You win in ~7 turns. */
const FOE_LINES = ["PLUDSKI uses RAPTURE BEAM!", "PLUDSKI throws a BIBLE at you!", "PLUDSKI taxes you! (emotionally)", "PLUDSKI calls you a sinner!", "PLUDSKI drone-strikes! (classic Pludski)"];
const FOE_LINES_MAD = ["PLUDSKI uses DOUBLE RAPTURE BEAM!", "PLUDSKI calls down KARMA (it bounces)!", "PLUDSKI eats a horse for strength!"];
function startFight() {
  php = pmax; ehp = 140; guard = false; turns = 0;
  playMusic("boss");
  fightTurn("The mustache flutters to the ground. PLUDSKI (HP 140) blocks the sun.\n\nDave's hubcap gleams in your hand. Slop squeaks encouragingly from your pocket.\n\nChoose your move, " + player + ".");
}
function drawBars() {
  $("bars").style.display = "flex";
  $("phpt").textContent = Math.max(0, php) + "/" + pmax;
  $("ehpt").textContent = Math.max(0, ehp) + "/140";
  $("php").style.width = Math.max(0, php / pmax * 100) + "%";
  $("ehp").style.width = Math.max(0, ehp / 140 * 100) + "%";
}
function fightTurn(msg) {
  stopTyping();
  drawBars();
  $("face").textContent = ehp <= 70 ? "🌟😡" : "🌟";
  $("name").textContent = ehp <= 70 ? "PLUDSKI (ENRAGED)" : "PLUDSKI";
  $("name").classList.add("glow");
  $("btns").innerHTML = "";
  refreshBar();
  const foeVoice = voiceFor($("name").textContent);
  typeText(msg, () => {
    const b = $("btns"); b.innerHTML = "";
    try { $("text").onclick = null; } catch (e) {}
    const moves = [
      ["🗡️ BONK (" + (10 + atk) + "–" + (15 + atk) + " dmg)", () => strike("bonk"), "", false],
      ["🧪 SLOP BOMB (26–38, x" + bombs + ")", () => strike("bomb"), "", bombs <= 0],
      ["🙏 PRAY (heal 16–24, x" + potions + ")", () => strike("pray"), "", potions <= 0],
      ["🛡️ BRACE (halve next hit)", () => strike("guard"), "", false],
    ];
    moves.forEach(([label, fn, cls, dis]) => {
      const btn = document.createElement("button");
      btn.textContent = label; if (dis) btn.disabled = true;
      btn.onclick = fn; // no click blip here: each move plays its own sound
      b.appendChild(btn);
    });
  }, foeVoice);
}
function strike(move) {
  turns++;
  let msg = "";
  if (move === "bonk") {
    const d = 10 + atk + Math.floor(Math.random() * 6);
    ehp -= d; sfx("bonk", 147, 0.5);
    msg = "You BONK Pludski for " + d + "! He says \"OW. RUDE. I'M A SAINT.\"\n";
  } else if (move === "bomb") {
    const d = 26 + Math.floor(Math.random() * 13);
    ehp -= d; bombs--; sfx("bonk", 120, 0.55);
    msg = "You hurl SLOP at Pludski for " + d + "! Slop screams \"FOR MY BROTHER!\"\n";
  } else if (move === "pray") {
    const h = 16 + Math.floor(Math.random() * 9);
    php = Math.min(pmax, php + h); potions--; sfx("lore", 165);
    msg = "You pray to no one in particular. +" + h + " HP. Satan gives a thumbs up.\n";
  } else {
    guard = true; sfx("lore", 120);
    msg = "You BRACE behind Dave's hubcap. Pludski squints. \"Coward's gambit,\" he mutters.\n";
  }
  if (ehp <= 0) { win(); return; }
  const mad = ehp <= 70;
  let fd = mad ? 9 + Math.floor(Math.random() * 7) : 6 + Math.floor(Math.random() * 6);
  if (guard) { fd = Math.ceil(fd / 2); guard = false; }
  php -= fd; sfx("hurt", 0, 0.5);
  const lines = mad ? FOE_LINES_MAD : FOE_LINES;
  msg += "\n" + lines[Math.floor(Math.random() * lines.length)] + " -" + fd + " HP."
    + (mad ? " (Pludski is ENRAGED!)" : "");
  if (php <= 0) {
    php = 0; drawBars();
    setScene("💀", "RAPTURED", "PLUDSKI raptured you. You ascend against your will.\n\nDAVE (in heaven): \"first time?\"\n\n(You keep your boons. The hubcap remembers.)",
      [["↻ TRY AGAIN", startFight, "big", false]]);
    return;
  }
  fightTurn(msg);
}
