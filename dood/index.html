<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0202;color:#ffb0a0;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px}
h1{font-size:28px;letter-spacing:4px;color:#ff2a00;text-shadow:3px 3px 0 #3d0000,0 0 20px rgba(255,40,0,.7)}
.sub{color:#b06a5a;font-style:italic;font-size:12px}
#hud{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#ffd93b;max-width:min(96vw,900px);text-align:center}
#hud b{color:#fff}
#wrap{position:relative;width:min(96vw,900px);aspect-ratio:3/2;border:4px solid #4a0d00;box-shadow:0 0 0 4px #0d0208,0 0 0 8px #ff3b00,0 0 50px rgba(255,40,0,.4);touch-action:none;overflow:hidden}
@media (orientation:portrait) and (max-width:700px){#wrap{width:100vw;aspect-ratio:3/4;border-width:2px}}
@media (max-width:640px){
 body{padding:8px 4px;gap:6px}
 h1{font-size:22px;letter-spacing:2px}
 .sub{font-size:11px;text-align:center;padding:0 8px}
 #hud{font-size:12px;gap:4px 12px}
 #overlay{padding:12px;overflow-y:auto;justify-content:flex-start;padding-top:8%}
 #overlay h2{font-size:22px}
 #overlay p{font-size:12px;max-width:94%}
 button{font-size:14px;padding:8px 18px}
 #lvlmsg{font-size:15px;top:10%}
 #seedrow{flex-wrap:wrap}
}
/* touch controls: twin-stick — left move, right look, fire button */
#touch{position:absolute;inset:0;z-index:7;display:none;pointer-events:none}
body.touch-game #touch{display:block}
#stick{position:absolute;left:12px;bottom:12px;width:110px;height:110px;border:2px solid rgba(255,180,80,.5);border-radius:50%;background:rgba(20,5,0,.35);pointer-events:auto;touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,106,42,.55);border:2px solid rgba(255,220,150,.7)}
#fireBtn{position:absolute;right:14px;bottom:24px;width:84px;height:84px;border-radius:50%;background:rgba(196,30,0,.6);border:3px solid #ffb300;color:#fff;font-size:28px;pointer-events:auto;touch-action:none}
#jumpLook{position:absolute;right:0;top:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
#wrap canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(12,1,0,.85);text-align:center;padding:20px;z-index:5}
#overlay.hidden{display:none}
#overlay h2{font-size:30px;color:#ff2a00}
#overlay p{font-size:13px;color:#e8a080;max-width:440px;line-height:1.6}
button{font-family:monospace;font-size:16px;padding:10px 26px;background:#c41e00;color:#fff;border:3px solid #ffb300;cursor:pointer}
#dmg{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,0,0,.55);opacity:0;transition:opacity .1s;z-index:4}
#lvlmsg{position:absolute;left:0;right:0;top:14%;text-align:center;color:#7dff5e;font-size:22px;letter-spacing:2px;pointer-events:none;z-index:4;text-shadow:2px 2px 0 #000,0 0 18px rgba(80,255,80,.6);opacity:0;transition:opacity .4s}
#exitarrow{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center;color:#39ff14;font-size:26px;text-shadow:0 0 10px rgba(57,255,20,.8),2px 2px 0 #000;line-height:1}
#exitarrow span{display:block;font-size:11px;color:#b0ffb0}
#doodad{width:min(460px,94%)}
#adretry{display:none;background:#0a6a2a;border-color:#7dff8a}
#endless{display:none;background:#0a3a6a;border-color:#7df9ff}
#adover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,0,0,.92);z-index:6}
#seedrow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:#e8a080}
#seedrow input{width:96px;background:#1a0500;color:#ffd93b;border:1px solid #ffb300;font-family:monospace;font-size:13px;padding:6px}
#seedrow input#lvlIn{width:52px}
#seedrnd{padding:6px 10px;font-size:13px}
</style>

camera.position.set(player.x,1.6+Math.sin(bobPhase*2)*.04*bobA,player.z);
camera.rotation.set(0,player.yaw,0,'YXZ');
shake=Math.max(0,shake-dt*1.8);
if(shake>0){const s=shake*shake; // positional + rotational kick in all axes
camera.position.x+=(Math.random()-.5)*.3*s;camera.position.y+=(Math.random()-.5)*.3*s;camera.position.z+=(Math.random()-.5)*.2*s;
camera.rotation.x+=(Math.random()-.5)*.06*s;camera.rotation.y+=(Math.random()-.5)*.06*s;}
gun.position.x=Math.sin(bobPhase)*.023*bobA;
gun.position.y=-.26+Math.sin(bobPhase*2)*.023*bobA-recoil*.15;
 if(muzzle>0)camera.position.y+=Math.random()*.05;
 }catch(err){running=false;document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('ovt').innerHTML='⚠ CRASH: '+(err&&err.message||err)+' — send a screenshot.';
  if(window.__doodErr!==err)console.error(err);}
 }
 renderer.render(scene,camera);
}
// death: shared overlay, rotating slop banner, one watch-ad retry per run
function die(msg){running=false;document.exitPointerLock();
document.getElementById('ovt').innerHTML=msg;
document.querySelector('#overlay h2').textContent='DOOD — U DIED';
document.getElementById('start').textContent='⛧ RE-ENTER ⛧';
if(window.HellAds)HellAds.mount(document.getElementById('doodad'),{exclude:'dood'});
document.getElementById('adretry').style.display=adRetryUsed?'none':'inline-block';
document.getElementById('overlay').classList.remove('hidden');}
document.getElementById('adretry').onclick=()=>{
if(adRetryUsed||!window.HellAds)return;
HellAds.play(document.getElementById('adover'),{secs:5,exclude:'dood',onStart:()=>{adPlaying=true;},onDone:()=>revive()});};
function revive(){ // the ad smote nearby demons and banished IT to the far side
adRetryUsed=true;adPlaying=false;document.getElementById('adretry').style.display='none';
player.hp=100;hpEl.textContent='100';
for(const e of enemies.slice())if(Math.hypot(e.x-player.x,e.z-player.z)<12)kill(e);
if(stalker){const pd=bfsDist(Math.floor(player.x/TS),Math.floor(player.z/TS));
let st={x:1,y:1},bd=-1;
for(let y=1;y<GH-1;y++)for(let x=0;x<GW-1;x++)
if(grid[y*GW+x]===0&&pd[y*GW+x]>bd){bd=pd[y*GW+x];st={x,y};}
stalker.x=(st.x+.5)*TS;stalker.z=(st.y+.5)*TS;stalker.wx=player.x;stalker.wz=player.z;stalker.repath=0;stalker.atk=1;}
showMsg('REVIVED BY AD — IT HAS BEEN BANISHED (for now)',2500);
document.getElementById('overlay').classList.add('hidden');running=true;
lockPointer();}
document.getElementById('seedrnd').onclick=()=>{document.getElementById('seedin').value=(Math.random()*1e9)|0;};
document.getElementById('start').onclick=()=>{
// seed setup: empty seed field = normal mode; otherwise the given seed at the given level
const sv=parseInt(document.getElementById('seedin').value,10);
LEVEL_SEED=isNaN(sv)?LEVEL_SEED_DEFAULT:sv;
level=Math.max(1,parseInt(document.getElementById('lvlIn').value,10)||1);
// reset
player.hp=100;kills=0;gibCount=0;adRetryUsed=false;
document.getElementById('adretry').style.display='none';
document.getElementById('endless').style.display='none';
hpEl.textContent='100';kEl.textContent='0';wEl.textContent=level;gEl.textContent='0';
genLevel(level);
document.getElementById('overlay').classList.add('hidden');running=true;ac();startMusic();
lockPointer();fit();};
document.getElementById('endless').onclick=()=>{ // optional endless: hell keeps going past 25
document.getElementById('endless').style.display='none';
level=26;player.hp=100;adRetryUsed=false;
hpEl.textContent='100';wEl.textContent='26';
genLevel(26);
document.getElementById('overlay').classList.add('hidden');running=true;
lockPointer();fit();};
fit();frame();
if(window.HellAds)HellAds.mount(document.getElementById('doodad'),{exclude:'dood'}); // slop banner on the title overlay
</script>
